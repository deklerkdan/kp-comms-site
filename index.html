<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KP Comms</title>
<meta name="theme-color" content="#f2f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KP Comms">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap">
<style>
/* Same look as the Streams / EcoFest / CCAN briefing pages. */
:root {
  --ground: #f2f4f5; --paper: #ffffff; --ink: #172128; --muted: #5d6b73; --line: #d6dde1;
  --accent: #2f6a86; --accent-soft: #e1edf3; --warm: #a9601a; --warm-soft: #f8ecdd;
  --done: #2e7d4f; --done-soft: #e3f2e8; --quiet: #7d8589; --quiet-soft: #eceeef; --sug: #7a4fa3; --sug-soft: #efe6f7;
  --fb: #2b4f9b; --fb-soft: #e3ebfb; --ig: #9b2b63; --ig-soft: #f9e3ef; --li: #1d5c86; --li-soft: #e0eef7; --tt: #222; --tt-soft: #e6e6e6;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light; --s: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #10161a; --paper: #182127; --ink: #e2eaee; --muted: #9eb0b9; --line: #2a3840;
    --accent: #6cb8d6; --accent-soft: #1a3340; --warm: #e2a057; --warm-soft: #3a2a18;
    --done: #6fcf95; --done-soft: #1b3326; --quiet: #8e989c; --quiet-soft: #232c31; --sug: #c7a2ea; --sug-soft: #2c2238;
    --fb: #9db5ee; --fb-soft: #1d2740; --ig: #eea0c6; --ig-soft: #3a1d2b; --li: #8cc3e6; --li-soft: #16303f; --tt: #ddd; --tt-soft: #2b2b2b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #10161a; --paper: #182127; --ink: #e2eaee; --muted: #9eb0b9; --line: #2a3840;
  --accent: #6cb8d6; --accent-soft: #1a3340; --warm: #e2a057; --warm-soft: #3a2a18;
  --done: #6fcf95; --done-soft: #1b3326; --quiet: #8e989c; --quiet-soft: #232c31; --sug: #c7a2ea; --sug-soft: #2c2238;
  --fb: #9db5ee; --fb-soft: #1d2740; --ig: #eea0c6; --ig-soft: #3a1d2b; --li: #8cc3e6; --li-soft: #16303f; --tt: #ddd; --tt-soft: #2b2b2b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: calc(16px * var(--s)); line-height: 1.5;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left)); }
a { color: var(--accent); }
button, input, textarea, select { font-family: inherit; font-size: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; }
h1 { font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(28px, 6vw, 38px) * var(--s)); line-height: 1.1; margin: 4px 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 500; font-size: calc(22px * var(--s)); margin: 26px 0 10px; }
.small { font-size: calc(13px * var(--s)); }
.muted { color: var(--muted); }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.error { background: var(--warm-soft); color: var(--warm); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
.tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-bottom: 8px; }
.tools button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 600; min-width: 40px; min-height: 36px; padding: 2px 10px; border-radius: 8px; cursor: pointer; font-size: calc(14px * var(--s)); }
.tools button:disabled { opacity: .4; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.brand { font-family: var(--f-display); font-size: calc(24px * var(--s)); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.nav button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.badge { background: var(--warm); color: #fff; border-radius: 999px; font-size: calc(12px * var(--s)); padding: 0 7px; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); font-weight: 600; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; text-decoration: none; }
.btn.pri { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.btn.sug { background: var(--sug); color: var(--paper); border-color: var(--sug); }
.btn.sm { padding: 3px 10px; font-size: calc(13px * var(--s)); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .55; cursor: wait; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.ccard { cursor: pointer; display: grid; gap: 4px; text-align: left; font: inherit; color: inherit; }
.ccard:hover { border-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: calc(12px * var(--s)); font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--quiet-soft); color: var(--quiet); white-space: nowrap; margin: 0 4px 4px 0; }
.ch-Facebook { background: var(--fb-soft); color: var(--fb); } .ch-Instagram { background: var(--ig-soft); color: var(--ig); }
.ch-LinkedIn { background: var(--li-soft); color: var(--li); } .ch-TikTok, .ch-Youtube { background: var(--tt-soft); color: var(--tt); }
.ch-Newsletter { background: var(--warm-soft); color: var(--warm); } .ch-Website { background: var(--done-soft); color: var(--done); }
.st-suggested { background: var(--sug-soft); color: var(--sug); } .st-idea, .st-planned, .st-hold { background: var(--quiet-soft); color: var(--quiet); }
.st-scheduled { background: var(--accent-soft); color: var(--accent); } .st-out { background: var(--done-soft); color: var(--done); } .st-figures { background: var(--warm-soft); color: var(--warm); }
.bar { height: 8px; background: var(--quiet-soft); border-radius: 9px; overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; background: var(--accent); } .bar.k i { background: var(--done); } .bar.over i { background: var(--warm); }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: calc(14px * var(--s)); color: var(--muted); }
.stats b { display: block; font-size: calc(18px * var(--s)); color: var(--ink); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; align-content: start; }
.tile .big { font-family: var(--f-display); font-size: calc(26px * var(--s)); line-height: 1.2; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: calc(14px * var(--s)); background: var(--paper); border-radius: 12px; overflow: hidden; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; } th { color: var(--muted); font-weight: 500; }
.post { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.post:last-child { border-bottom: 0; } .post .d { min-width: 58px; font-size: calc(13px * var(--s)); color: var(--muted); padding-top: 2px; }
.post .m { flex: 1; min-width: 0; } .post .m b { cursor: pointer; }
.post .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; align-items: center; }
.filters button { border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 3px 12px; font-weight: 600; cursor: pointer; font-size: calc(13px * var(--s)); }
.filters button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.filters select, .filters input { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 4px 8px; font-size: calc(14px * var(--s)); max-width: 180px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal > div { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; min-height: 92px; padding: 4px; font-size: calc(12px * var(--s)); overflow: hidden; }
.cal .h { min-height: 0; background: none; border: 0; text-align: center; color: var(--muted); }
.cal .x { opacity: .45; } .cal .today { outline: 2px solid var(--accent); }
.cal .chip { display: block; white-space: normal; margin: 3px 0; cursor: pointer; text-align: left; border: 0; width: 100%; font-family: inherit; }
.daylist h3 { font-size: calc(14px * var(--s)); margin: 14px 0 4px; color: var(--muted); font-weight: 600; }
.note { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--muted); font-size: calc(14px * var(--s)); margin: 8px 0; }
.cmt { background: var(--ground); border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: calc(14px * var(--s)); }
.modal-back { position: fixed; inset: 0; z-index: 40; background: rgba(8,12,14,.6); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
.modal { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: 100%; max-width: 540px; display: grid; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.35); margin: auto 0; }
.modal h2 { margin: 0; }
.modal label { display: grid; gap: 3px; font-size: calc(14px * var(--s)); color: var(--muted); }
.modal input, .modal textarea, .modal select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--ground); color: var(--ink); }
.modal input[type=checkbox] { width: auto; }
.modal .qr { background: #fff; border-radius: 10px; padding: 8px; width: min(100%, 240px); margin: 0 auto; line-height: 0; }
.modal .qr svg { width: 100%; height: auto; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 600; }
.pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.kpied { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; z-index: 60; font-size: calc(14px * var(--s)); max-width: 90vw; }
.ico { display: inline-flex; vertical-align: middle; line-height: 0; }
.ico svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.new { border-left: 3px solid var(--warm); padding-left: 8px; }
.new .m > b:first-child::before { content: '● '; color: var(--warm); }
.btn.hot { border-color: var(--warm); color: var(--warm); background: var(--warm-soft); }
.camptag { font-style: italic; font-weight: 300; color: var(--muted); font-size: calc(13px * var(--s)); margin-left: 4px; }
.merge { font-size: calc(12px * var(--s)); color: var(--muted); display: block; }
.merge button { border: 0; background: none; color: var(--accent); padding: 0; cursor: pointer; text-decoration: underline; font-size: inherit; }
.sub { padding-left: 14px; border-left: 2px solid var(--line); margin-left: 4px; }
fieldset.form { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
fieldset.form:disabled { opacity: .6; }
.toast button { margin-left: 10px; background: none; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 1px 10px; cursor: pointer; font-weight: 700; }
@media (max-width: 680px) {
  .cal { grid-template-columns: 1fr; } .cal .h, .cal .x, .cal .empty { display: none; } .cal > div { min-height: 0; }
  .post { flex-wrap: wrap; } .post .acts { width: 100%; justify-content: flex-start; }
  .two { grid-template-columns: 1fr; }
}
</style>

function modal(title, kids, opts) {

  const box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, [el('h2', { text: title }), el('fieldset', { class: 'form' }, kids)]);
  const back = el('div', { class: 'modal-back', onclick: e => { if (e.target === back) close(); } }, box);
  document.body.append(back);

  const f = box.querySelector('input,textarea,select,button'); if (f) f.focus();
  return close;
}

/* ------------------------------------------------ inbox */
function isUnread(id) { return !(S.me && S.me.inbox && S.me.inbox[id]); }
/** Marks inbox items read / done (archived) / '' (unread) for me; updates the page at once, saves in the background. */
function mark(ids, state) {
  ids = [].concat(ids).filter(Boolean);
  if (!ids.length) return Promise.resolve();
  S.me.inbox = S.me.inbox || {};
  ids.forEach(id => { if (state) { if (!(state === 'read' && S.me.inbox[id] === 'done')) S.me.inbox[id] = state; } else delete S.me.inbox[id]; });
  render();
  return authed('inboxMark', ids, state).then(st => { S.me.inbox = st; }).catch(e => toast(e.message));
}
function inboxItems() {
  if (!S.D || !S.me) return [];
  const myPosts = new Set(S.D.comments.filter(c => c.by && c.by.id === S.me.id).map(c => c.post));
  S.D.posts.forEach(p => { if (p.by && p.by.id === S.me.id) myPosts.add(p.id); });
  const mineC = tag => S.me.comms || isMine(camp(tag) || {});
  const items = [];
  S.D.posts.filter(p => p.stage === 'suggested').forEach(p => { if (p.campaigns.some(mineC)) items.push({ id: itemId.s(p), at: p.suggestedOn, kind: 'suggest', p }); });
  S.D.comments.forEach(c => { if (mineC(c.campaign) || myPosts.has(c.post)) items.push({ id: itemId.c(c), at: c.at, kind: 'comment', c }); });
  S.D.progress.forEach(e => { if (mineC(e.campaign) && e.at && e.by) items.push({ id: itemId.e(e), at: e.at, kind: 'kpi', e }); });
  (S.feedback || []).forEach(fb => items.push({ id: fb.id, at: fb.at, kind: 'feedback', f: fb }));
  const cut = new Date(Date.now() - 60 * 86400000).toISOString();
  return items.filter(i => i.at && (i.kind === 'suggest' || i.at >= cut))
    .map(i => Object.assign(i, { mine: mineBy(i.p) || mineBy(i.c) || mineBy(i.e) || mineBy(i.f) }))
    .map(i => Object.assign(i, { state: (S.me.inbox || {})[i.id] || '' }))
    .map(i => Object.assign(i, { isNew: !i.state && !i.mine }))
    .sort((a, b) => b.at.localeCompare(a.at));
}

    acts.push(i.state === 'done'
      ? el('button', { class: 'btn sm', type: 'button', text: 'Back to to-do', onclick: () => mark([i.id], 'read') })
      : el('button', { class: 'btn sm', type: 'button', title: 'Archive: done with this', 'aria-label': 'Archive', onclick: () => { mark([i.id], 'done'); toast('Archived', () => mark([i.id], 'read')); } }, [L('check', 'Archive')]));
    if (i.state === 'read') acts.push(el('button', { class: 'btn link small', type: 'button', text: 'Mark unread', onclick: () => mark([i.id], '') }));
    return el('div', { class: 'post' + (i.isNew ? ' new' : '') }, [el('div', { class: 'd', text: fmtWhen(i.at) }), el('div', { class: 'm' }, main), el('div', { class: 'acts' }, acts)]);
  };
  const unread = todo.filter(i => i.isNew);
  return el('section', {}, [
    el('h1', { text: 'Inbox' }),
    el('p', { class: 'muted', text: (S.me.comms ? 'Everything on all campaigns, plus app feedback' : 'Everything on your campaigns and on posts you’ve commented on') + ': suggestions, comments and KPI updates, including your own (as reminders). Read it, act on it, archive it. Your inbox is your own: archiving here doesn’t change anyone else’s.' }),
    el('div', { class: 'filters' }, [
      el('button', { type: 'button', 'aria-pressed': S.ibox !== 'done' ? 'true' : 'false', onclick: () => { S.ibox = 'todo'; render(); } }, 'To do (' + todo.length + ')'),
      el('button', { type: 'button', 'aria-pressed': S.ibox === 'done' ? 'true' : 'false', onclick: () => { S.ibox = 'done'; render(); } }, 'Archived (' + done.length + ')'),
      S.ibox !== 'done' && unread.length ? el('button', { type: 'button', onclick: () => mark(unread.map(i => i.id), 'read') }, 'Mark all read') : '',
      S.ibox !== 'done' && todo.length ? el('button', { type: 'button', onclick: () => { const ids = todo.filter(i => i.kind !== 'suggest').map(i => i.id); mark(ids, 'done'); toast('Archived ' + ids.length, () => mark(ids, 'read')); } }, 'Archive all (not suggestions)') : '',
    ]),
    el('div', { class: 'card' }, list.length ? list.map(line) : el('p', { class: 'muted', text: S.ibox === 'done' ? 'Nothing archived yet.' : 'All done. Nothing waiting.' })),
  ]);
}

/* ------------------------------------------------ start */
function start() {
  applyPrefs();
  if (!API && window.google && google.script && google.script.url) {
    google.script.url.getLocation(loc => { const c = loc.parameter && loc.parameter.c; if (c) S.route = { page: 'campaign', tag: '#' + c }; render(); });
  } else S.route = readRoute();
  render();
  if (S.session) refresh(!!S.D);
  setInterval(() => { if (S.session && document.visibilityState === 'visible' && !document.querySelector('.modal-back')) refresh(true); }, 120000);
}
start();
</script>
